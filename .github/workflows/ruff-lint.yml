name: Lint with Ruff

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11.13'  # Adjust this to the Python version your project uses

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.9.2

      - name: Run Ruff
        run: ruff format --check -v --config ruff.toml