[project]
name = "annealedrl"
version = "0.1.0"
description = "annealed RL experiments"
readme = "README.md"
requires-python = "==3.11.13"
dependencies = [
    "hydra-core>=1.3.2",
    "jax[tpu]>=0.6.2",
    "pre-commit>=4.5.1",
    "ruff>=0.14.10",
    "stax",
]

[project.optional-dependencies]
eval = [        
    "openbench>=0.5.3",
    "vllm-tpu>=0.12.0",
]

[tool.uv.sources]
stax = { git = "https://github.com/adityamakkar000/stax" }
