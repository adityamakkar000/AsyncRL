[project]
name = "annealedrl"
version = "0.1.0"
description = "annealed RL experiments"
readme = "README.md"
requires-python = "==3.11.13"

dependencies = [
    "einops>=0.8.1",
    "hydra-core==1.3.2",
    "jax>=0.8.0; platform_system != 'Linux'",
    "jax[tpu]>=0.6.2; platform_system == 'Linux'",
    "jaxtyping>=0.3.4",
    "pre-commit>=4.5.1",
    "python-dotenv>=1.2.1",
    "ruff>=0.14.10",
    "stax",
    "torch>=2.9.0",
    "transformers>=4.57.3",
]

[project.optional-dependencies]
eval = [        
    "openbench>=0.5.3",
    "vllm-tpu>=0.12.0",
]

[tool.uv.sources]
stax = { git = "https://github.com/adityamakkar000/stax.git", branch="aditya/Enum"}
