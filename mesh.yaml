# mesh config for https://github.com/adityamakkar000/mesh
commands:
  - curl -LsSf https://astral.sh/uv/install.sh | sh
  - rm -rf ~/job

ignore:
  - "*.pyc"
  - "*/__pycache__/*"
  - ".git/*"
  - ".venv/*"
  - "profile/*"

prerun:
  - sudo chown -R $USER:$USER /tmp/tpu_logs
  - uv venv --clear
  - source .venv/bin/activate
  - source .env
  - echo "machine github.com login x-access-token password ${STAX_TOKEN}" > ~/.netrc
  - chmod 600 ~/.netrc
  - uv sync
  - hf auth login --token ${HF_TOKEN}