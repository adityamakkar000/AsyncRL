# mesh config for https://github.com/adityamakkar000/mesh
commands:
  - curl -LsSf https://astral.sh/uv/install.sh | sh

ignore:
  - "*.pyc"
  - "*/__pycache__/*"
  - ".git/*"
  - ".venv/*"

prerun:
  - uv venv --clear
  - source .venv/bin/activate
  - source .env
  - git config --global url."https://${STAX_TOKEN}@github.com/".insteadOf "https://github.com/"
  - uv sync --extra eval
  - wandb login ${WANDB_API_KEY} --relogin
