# mesh config for https://github.com/adityamakkar000/mesh
commands:
  - curl -LsSf https://astral.sh/uv/install.sh | sh
  - rm -rf ~/job
  - rm -rf ~/.cache/uv
  
ignore:
  - "*.pyc"
  - "*/__pycache__/*"
  - ".git/*"
  - ".venv/*"

prerun:
  - uv venv --clear
  - sudo chown -R $USER:$USER /tmp/tpu_logs
  - source .venv/bin/activate
  - source .env
  - echo "machine github.com login x-access-token password ${STAX_TOKEN}" > ~/.netrc
  - chmod 600 ~/.netrc
  - uv sync
