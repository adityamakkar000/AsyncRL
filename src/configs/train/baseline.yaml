defaults:
  - base
  - model_config: qwen_1.7b_base
  - loss_config: loss
  - datasets@data_config: troll-17k-train-filtered
  - _self_

grad_accum_steps: 8
seed: 0
num_steps: 1000

optimizer: "adamw"
weight_decay: 0.01
grad_clip: 1.0

learning_rate_init: 1e-6
learning_rate_peak: 1e-6
learning_rate_end: 1e-6
warmup_steps: 0.01
decay_steps: 0.9

spot_training: true
checkpoint_interval: 25
max_checkpoints_to_keep: 5

wandb_config:
  project: "Baselinev2"
  notes: null
  tags: null

data_config:
  batch_size: 512

loss_config:
  inference_config:
    max_seq_len: 4096
    max_decode_prompts: 8
    max_decode_batch_size: 64
    group_size: 16
    temperature: 1.0
    reasoning_budget: null 
    think_mode: true
    system_prompt: true

sharding_config: 
  opt_state_offload: false
  data_shard_dim: 0
  min_bytes_for_fsdp: 1048576
  weight_shard_dim: 0
  cp_shard_dim: 1
  dp_group_size: 1
  cp_group_size: 1
  fsdp_group_size: -1

async_config:
  train_workers: 2
  max_lag: 4
    
metrics_to_log:
  - "train/loss"
  - "train/is_ratio_step_0"
  - "train/mean_reward"
  - "val/mean_reward"
