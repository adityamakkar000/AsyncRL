defaults: 
  - debug
  - _self_

grad_accum_steps: 4
seed: 0
num_steps: 1000
val_steps: 1
val_interval: 100

optimizer: "adamw"
weight_decay: 0.01
grad_clip: 1.0

learning_rate_init: 1e-4
learning_rate_peak: 1e-5
learning_rate_end: 1e-5
warmup_steps: 0.1
decay_steps: 0.9

spot_training: true 
checkpoint_interval: 100
best_metric: null
max_checkpoints_to_keep: 1

wandb_config: 
  project: "AnnealedRL"
  notes: null
  tags: null

# prompts = 64 / 16 = 4 
data_config:
  train_config:
    batch_size: 64
  val_config:
    batch_size: 64 
loss_config:
  inference_config:
    max_seq_len: 8192
    batch_size: 4
    group_size: 16

metrics_to_log:
  - "train/loss"
  - "train/mean_reward"
  - "val/mean_reward"