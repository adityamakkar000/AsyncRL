<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Log</title>
<style>
:root { --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e4df; --accent: #2b6cb0; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #151514; --panel: #1e1e1c; --text: #ecece8; --muted: #9a9a93; --line: #2f2f2c; --accent: #63b3ed; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
header { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header a { color: var(--accent); text-decoration: none; }
.job { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { padding: 3px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 12px; color: var(--text); text-decoration: none; }
.tab.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.status { margin-left: auto; color: var(--muted); font-size: 12px; }
label { font-size: 12px; color: var(--muted); display: flex; gap: 4px; align-items: center; }
#log { flex: 1; overflow: auto; margin: 0; padding: 8px 16px 24px; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
.marker { color: var(--muted); text-align: center; padding: 6px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <a href="/">← jobs</a>
  <span class="job" id="job"></span>
  <span class="tabs" id="tabs"></span>
  <label><input type="checkbox" id="follow" checked> follow</label>
  <span class="status" id="status"></span>
</header>
<div id="log"><div class="marker" id="top"></div><span id="text"></span></div>
<script>
const CHUNK = 65536;
const node = decodeURIComponent(location.pathname.split("/").pop());
const rank = new URLSearchParams(location.search).get("rank");
const base = `/logs/${encodeURIComponent(node)}/chunk?size=${CHUNK}` + (rank === null ? "" : `&rank=${rank}`);
const logEl = document.getElementById("log"), textEl = document.getElementById("text"), topEl = document.getElementById("top");
const clean = s => s.replace(/\x1b\[[0-9;]*[A-Za-z]/g, "").replace(/\r/g, "");
let start = 0, end = 0, loadingOlder = false;
document.getElementById("job").textContent = node;
document.title = `${node} ${rank === null ? "mesh" : "host " + rank}`;

const atBottom = () => logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
function setTop() { topEl.textContent = start > 0 ? `scroll up for earlier output (${(start / 1024).toFixed(0)} KB above)` : "start of log"; }
function status(t, total) { document.getElementById("status").textContent = `${(total / 1024).toFixed(0)} KB · updated ${new Date().toLocaleTimeString()}`; }

async function chunk(q) { return (await fetch(base + q)).json(); }

async function init() {
  const ranks = await (await fetch(`/logs/${encodeURIComponent(node)}/ranks`)).json().catch(() => []);
  const tabs = [`<a class="tab ${rank === null ? "on" : ""}" href="?">mesh</a>`].concat(
    ranks.map(f => f.match(/^w(\d+)\.txt$/)).filter(Boolean).map(m => `<a class="tab ${rank === m[1] ? "on" : ""}" href="?rank=${m[1]}">host ${m[1]}</a>`));
  document.getElementById("tabs").innerHTML = tabs.join("");
  const c = await chunk("");
  if (c.missing) { topEl.textContent = "no log file yet, waiting…"; }
  textEl.textContent = clean(c.text);
  start = c.start; end = c.end; setTop(); status("", c.total);
  logEl.scrollTop = logEl.scrollHeight;
  setInterval(poll, 2000);
}

async function older() {
  if (loadingOlder || start <= 0) return;
  loadingOlder = true;
  const c = await chunk(`&before=${start}`);
  const h = logEl.scrollHeight;
  textEl.textContent = clean(c.text) + textEl.textContent;
  start = c.start; setTop();
  logEl.scrollTop += logEl.scrollHeight - h;
  loadingOlder = false;
}

async function poll() {
  try {
    const c = await chunk(`&after=${end}`);
    if (c.total < end) { location.reload(); return; }
    if (c.text) {
      const stick = document.getElementById("follow").checked && atBottom();
      textEl.append(clean(c.text));
      end = c.end;
      if (stick) logEl.scrollTop = logEl.scrollHeight;
    }
    status("", c.total);
  } catch (e) { document.getElementById("status").textContent = "server unreachable"; }
}

logEl.addEventListener("scroll", () => { if (logEl.scrollTop < 300) older(); });
init();
</script>
</body>
</html>
