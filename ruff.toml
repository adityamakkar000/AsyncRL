line-length = 120
target-version = "py311"
respect-gitignore = true

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
exclude = ["*.ipynb", "src/model/flash_attention.py"]

[lint]
exclude = ["*.ipynb", "src/model/flash_attention.py"]
extend-select = [
    "F", 
    "I",
]
